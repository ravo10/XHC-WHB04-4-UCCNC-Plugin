name: delete-old-runs

# Run by hand (Actions -> delete-old-runs -> Run workflow) to delete finished
# workflow runs (and their logs and artifacts) started before a given time.
on:
  workflow_dispatch:
    inputs:
      before:
        description: "Delete runs created before this UTC time, e.g. 2026-11-13T21:31:00Z"
        required: true

permissions:
  actions: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old runs
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ inputs.before }}
        run: |
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.status == \"completed\" and .created_at < \"$BEFORE\") | .id")
          n=0
          for id in $ids; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" && n=$((n+1))
          done
          echo "Deleted $n run(s) created before $BEFORE"
