name: delete-releases

# Run by hand (Actions -> delete-releases -> Run workflow) to delete old releases
# and their tags. The input is a space-separated list of tags, e.g. "v0.4.3 v0.4.4".
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Space-separated release tags to delete (release and tag)"
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ inputs.tags }}
        run: |
          for t in $TAGS; do
            echo "Deleting $t"
            gh release delete "$t" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
